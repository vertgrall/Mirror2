[package]
name = "likeness"
version = "0.1.0"
edition = "2021"
description = "Likeness by NT — outsider spiritual successor to Photo Booth. No curtains."
authors = ["Jon McMillion / New Tower"]
license = "UNLICENSED"

[dependencies]
async-io = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dispatch = "0.2"
freya = { version = "0.4", features = ["engine"] }
freya-skia-safe = { version = "0.98.1", default-features = false, features = ["textlayout"] }
keyboard-types = "0.8"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa-foundation = "0.2"
core-foundation = "0.10"
core-media-sys = "0.1"
core-video-sys = "0.1"
objc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
